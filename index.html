<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sketchbooks</title>
<script>try{var t=JSON.parse(localStorage.getItem('sketchbooks-theme'))||{};if(t.skin)document.documentElement.dataset.skin=t.skin;if(t.mode)document.documentElement.dataset.theme=t.mode}catch(e){}</script>
<link rel="stylesheet" href="/src/styles/main.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Figtree:wght@400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<script>window.MathJax={svg:{fontCache:"none"},startup:{typeset:false}}</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" integrity="sha384-AQ3POAMqIhwS81FrUH95ekxqBZHeP5tG2JfEL3+7GuTtfRLWnrRh32UxwzM+//A9" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" integrity="sha384-TnlRYaR4JYz/lpaGuaiU61PjNberSA4vjLjtF+oRC/IkohkJqnWxw5EmDSOt1vA1" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" integrity="sha384-qn4Jh88HhJA8dplNQyGjOh9OGI4izVhrfj/qIFgaKcdgOE06pXqIKGlsCILZcLAC" crossorigin="anonymous"></script>
</head>
<body>
<div hidden><button id="bak"></button><button id="imp"></button><input type="file" id="ifile" accept=".json"><input type="file" id="imgf" accept="image/*"></div>
<div id="main">
<canvas id="cv" role="img" aria-label="Drawing canvas for the current page" aria-describedby="cvdesc"></canvas>
<div id="tools" class="bar"></div>
<div id="toolpop" class="bar" hidden></div>
<header id="topr" class="nav"></header>
<div id="ctx" class="bar" hidden></div>
<aside id="panel" hidden aria-label="Properties"></aside>
<div id="pgpop" class="bar" hidden></div><div id="bkpop" class="bar" hidden></div>
<div id="cpal" class="bar" hidden></div>
<div id="mbox" class="bar" hidden role="dialog" aria-label="Formula and graph">
<div class="mh"><div class="seg" id="mtab" role="tablist"><button class="b on" data-mt="f" role="tab" aria-selected="true">Formula</button><button class="b" data-mt="g" role="tab" aria-selected="false">Graph</button></div><span class="grow"></span><button class="ib" id="mkb" title="Math keyboard" aria-label="Show math keyboard"></button><button class="ib" id="mno" title="Close (Esc)" aria-label="Close"></button></div>
<div id="mfw"></div><textarea id="mtex" hidden placeholder="LaTeX, e.g. x = \frac{-b \pm \sqrt{b^2-4ac}}{2a}" aria-label="Formula in LaTeX"></textarea>
<div id="mpf"><div id="msv"></div><div id="mres" aria-live="polite"></div><button class="pill" id="madd" hidden>Add result to page</button></div>
<div id="mpg" hidden><div class="mrng"><label class="nf"><span>x from</span><input id="gx0" type="number" inputmode="decimal" value="-10"></label><label class="nf"><span>to</span><input id="gx1" type="number" inputmode="decimal" value="10"></label><label class="nf"><span>y from</span><input id="gy0" type="number" inputmode="decimal" placeholder="auto"></label><label class="nf"><span>to</span><input id="gy1" type="number" inputmode="decimal" placeholder="auto"></label></div><canvas id="gprev" aria-label="Graph preview"></canvas><small class="mhint">Write y in terms of x. Separate several functions with ; e.g. sin(x); x^2/4</small></div>
<div class="mfoot"><small class="mhint">Ctrl+Enter to insert</small><span class="grow"></span><button class="pill" id="mcancel">Cancel</button><button class="pill pri" id="mok">Insert formula</button></div>
</div>
<div id="cvdesc" class="sr"></div>
</div>
<aside id="reader" hidden><div class="rh"><b id="rt"></b><span class="grow"></span><a id="ro" class="b" target="_blank" rel="noopener">Open ↗</a><button id="rx" class="b" aria-label="Close reader">✕</button></div><small class="rn">If the page stays blank, that site does not allow embedding. Use “Open ↗” instead.</small><iframe id="rf" referrerpolicy="no-referrer" sandbox="allow-scripts allow-forms allow-popups"></iframe></aside>
<div id="vbox" class="bar" hidden><div class="row"><select id="vlang"></select><button class="b" id="vgo">● Record</button><button class="b" id="vadd">Add to page</button></div><div id="vtxt">Press Record to transcribe live. The audio is saved on this device.</div><div id="vlist"></div></div>
<input type="file" id="bkf" accept="application/pdf" hidden>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="svbar" hidden>Unsaved changes <button id="svnow">Save now</button><button id="svx">Dismiss</button></div>
<div id="home" hidden></div>
<script type="module" src="/src/main.js"></script></body></html>
